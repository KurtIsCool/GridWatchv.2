name: Verify and deploy GridWatch

on:
  pull_request:
    paths:
      - 'gridwatch_github_ready/gridwatch_github_ready/**'
      - '.github/workflows/verify-and-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'gridwatch_github_ready/gridwatch_github_ready/**'
      - '.github/workflows/verify-and-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gridwatch-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gridwatch_github_ready/gridwatch_github_ready
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tests/link-integrity.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gridwatch_github_ready/gridwatch_github_ready
      - id: deployment
        uses: actions/deploy-pages@v4
